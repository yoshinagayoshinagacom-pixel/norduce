<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Norduce Inc.</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    padding: 60px 24px;
    max-width: 520px;
  }
  .logo-img {
    max-width: 320px;
    width: 100%;
    margin-bottom: 12px;
  }
  .domain {
    font-size: 14px;
    color: #999;
    letter-spacing: 3px;
    margin-bottom: 48px;
  }
  .divider {
    width: 40px;
    height: 1px;
    background: #ccc;
    margin: 0 auto 48px;
  }
  .message {
    font-size: 15px;
    color: #666;
    line-height: 2;
    letter-spacing: 1px;
  }
  .contact {
    margin-top: 48px;
    font-size: 13px;
    color: #999;
    letter-spacing: 1px;
  }
  .contact a {
    color: #1a1a1a;
    text-decoration: none;
    border-bottom: 1px solid #ddd;
    padding-bottom: 1px;
  }
  .contact a:hover {
    border-color: #1a1a1a;
  }
</style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Norduce" class="logo-img">
    <div class="domain">norduce.co.jp</div>
    <div class="divider"></div>
    <p class="message">
      サイトは現在準備中です。<br>
      近日公開予定。
    </p>
    <div class="contact">
      <a href="mailto:yoshinaga.hashimoto@norduce.co.jp">yoshinaga.hashimoto@norduce.co.jp</a>
    </div>
  </div>
</body>
</html>
